<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Diagonal airmail stripe pattern (Red / Cream / Blue / Cream) -->
    <pattern id="airmail-stripes" width="192" height="192" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="192" height="192" fill="#FFFCF5" />
      <rect x="0" y="0" width="56" height="192" fill="#C8323C" />
      <rect x="96" y="0" width="56" height="192" fill="#24479A" />
    </pattern>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#15223B" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Full-bleed airmail striped background (stores apply their own mask) -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#airmail-stripes)" />

  <!-- Inner warm cream paper card -->
  <rect x="96" y="96" width="832" height="832" rx="112" fill="#FFFCF5" filter="url(#card-shadow)" />

  <!-- Double philatelic engraving frame -->
  <rect x="136" y="136" width="752" height="752" rx="80" fill="none" stroke="#15223B" stroke-width="10" />
  <rect x="158" y="158" width="708" height="708" rx="64" fill="none" stroke="#E3DACA" stroke-width="6" stroke-dasharray="18 14" />

  <!-- Subtle postmark cancel rings in top-right corner -->
  <g opacity="0.16" stroke="#15223B" fill="none">
    <circle cx="748" cy="276" r="110" stroke-width="8" />
    <circle cx="748" cy="276" r="76" stroke-width="5" />
    <path d="M 560 248 q 28 -18 56 0 t 56 0 56 0" stroke-width="7" />
    <path d="M 560 278 q 28 -18 56 0 t 56 0 56 0" stroke-width="7" />
    <path d="M 560 308 q 28 -18 56 0 t 56 0 56 0" stroke-width="7" />
  </g>

  <!-- Par Avion wing chevron emblem at top center -->
  <polygon points="512,216 404,258 434,274 512,244 590,274 620,258" fill="#C8323C" />
  <polygon points="512,190 438,220 460,232 512,212 564,232 586,220" fill="#24479A" />

  <!-- Bold Besley slab-serif "W" monogram -->
  <path
    d="M 252 340 L 388 340 L 388 382 L 354 382 L 420 622 L 494 394 L 538 394 L 610 622 L 676 382 L 642 382 L 642 340 L 772 340 L 772 382 L 738 382 L 636 724 L 574 724 L 506 508 L 436 724 L 374 724 L 278 382 L 252 382 Z"
    fill="#15223B"
  />

  <!-- Bottom philatelic rule & WAYMARK caption bar -->
  <line x1="332" y1="786" x2="692" y2="786" stroke="#C8323C" stroke-width="8" stroke-linecap="round" />
  <circle cx="512" cy="786" r="10" fill="#24479A" stroke="#FFFCF5" stroke-width="4" />
</svg>
