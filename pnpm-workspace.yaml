allowBuilds:
  supabase: true
  unrs-resolver: true

# Patched releases of transitive dependencies (pnpm audit), each within the
# major line its dependents ask for. All are build, dev-server, lint or test
# tooling; none ships in the app bundle.
overrides:
  shell-quote: ^1.12.0
  compression: ^1.8.2
  '@xmldom/xmldom@<0.9.0': ^0.8.15
  '@xmldom/xmldom@>=0.9.0': ^0.9.12
  xcode>uuid: ^11.1.1
  brace-expansion@<2: ^1.1.21
  brace-expansion@>=4: ^5.0.12
  js-yaml@>=4: ^4.3.2
  browserslist: ^4.28.7
  baseline-browser-mapping: ^2.11.0
  postcss: ^8.5.23
  source-map-js: ^1.2.2
  eslint-plugin-react-hooks>zod: ^4.6.7
  zod-validation-error>zod: ^4.6.7
